name: Lint PR name
on:
  pull_request:
    types: ["opened", "edited", "reopened", "synchronize"]

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Check Out Files
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install Commitlint Config
        run: |
          mkdir -p /tmp/pr-lint
          cp commitlint.config.* /tmp/pr-lint/
          npm install --prefix /tmp/pr-lint --no-save @commitlint/config-conventional@20

      - uses: JulienKode/pull-request-name-linter-action@v20.5.0
        with:
          configuration-path: /tmp/pr-lint/commitlint.config.js