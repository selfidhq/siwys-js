name: Publish Packages

on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize]

permissions:
  contents: write
  id-token: write
  packages: write
  pull-requests: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.ref || github.ref }}

      - name: Use Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22.x
          registry-url: 'https://registry.npmjs.org/'

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Install & Build
        run: |
          yarn install --frozen-lockfile
          yarn build

      - name: Version and Publish
        env:
          npm_config_provenance: true
          npm_config_access: public
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Detect if we are on the main branch
          IS_MAIN=$([[ "${{ github.ref }}" == "refs/heads/main" || "${{ github.base_ref }}" == "main" ]] && [[ "${{ github.event_name }}" == "push" ]] && echo "true" || echo "false")

          if [ "$IS_MAIN" = "true" ]; then
            COMMIT_MSG=$(git log -1 --pretty=%B)

            if [[ "$COMMIT_MSG" =~ ^chore\(release\): ]]; then
              echo "🚀 Merged release PR detected. Publishing packages to npm..."
              yarn lerna publish from-package \
                --no-verify-access \
                --yes

              echo "🏷️ Creating and pushing release tags..."
              for pkg in packages/*; do
                if [ -f "$pkg/package.json" ]; then
                  PKG_NAME=$(jq -r .name "$pkg/package.json")
                  PKG_VER=$(jq -r .version "$pkg/package.json")
                  TAG="$PKG_NAME@$PKG_VER"
                  if ! git rev-parse "$TAG" >/dev/null 2>&1; then
                    echo "Tagging $TAG..."
                    git tag "$TAG" -m "$TAG"
                    git push origin "$TAG"
                    gh release create "$TAG" --title "$TAG" --generate-notes || true
                  fi
                fi
              done
            else
              echo "🔍 Checking for changed packages..."
              if yarn lerna changed >/dev/null 2>&1; then
                echo "📦 Packages changed. Creating or updating release PR..."
                BRANCH="chore/automated-release"
                git checkout -B "$BRANCH"

                yarn lerna version \
                  --conventional-commits \
                  --no-git-tag-version \
                  --no-push \
                  --allow-branch '*' \
                  --yes

                git add .
                git commit -m "chore(release): publish packages" --no-verify
                git push -u origin "$BRANCH" --force

                PR_NUMBER=$(gh pr list --head "$BRANCH" --base main --state open --json number --jq '.[0].number')
                if [ -z "$PR_NUMBER" ]; then
                  gh pr create \
                    --base main \
                    --head "$BRANCH" \
                    --title "chore(release): publish packages" \
                    --body "Automated release PR generated by Lerna in CI. Merge this PR to publish updated packages to npm."
                else
                  echo "Updated existing release PR #$PR_NUMBER"
                fi
              else
                echo "No packages changed. Nothing to release."
              fi
            fi
          else
            RAW_BRANCH="${{ github.head_ref || github.ref_name }}"
            if [[ "$RAW_BRANCH" == "chore/automated-release" ]]; then
              echo "Skipping canary release for automated release branch."
              exit 0
            fi

            echo "🧪 Performing Canary Release for Branch..."
            
            # 1. Get branch name
            SAFE_BRANCH=$(echo "$RAW_BRANCH" | sed 's/\//-/g' | sed 's/refs-heads-//g')

            # 2. Use the GitHub Run Number to force an increment
            VERSION_ID="$SAFE_BRANCH.${{ github.run_number }}"

            echo "🚀 Versioning with ID: $VERSION_ID"

            yarn lerna version prerelease \
              --preid "$VERSION_ID" \
              --yes \
              --no-push \
              --no-git-tag-version \
              --force-publish \
              --allow-branch '*'

            # 3. Clean the tree
            git add .
            git commit -m "chore: temporary canary bump for run ${{ github.run_number }}"

            # 4. Publish
            # Using --dist-tag to keep it on the branch name tag
            yarn lerna publish from-package \
              --dist-tag "$SAFE_BRANCH" \
              --no-verify-access \
              --concurrency 1 \
              --yes
          fi