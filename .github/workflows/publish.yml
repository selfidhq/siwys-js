name: Publish Packages

on:
  pull_request:
    types: [opened, synchronize]
  workflow_dispatch:
    inputs:
      package:
        description: 'Package to publish'
        required: true
        type: choice
        options:
          - 'all'
          - '@yourself_id/siwys-api-js'
          - '@yourself_id/siwys-react-js'
          - '@yourself_id/siwys-react-native'
      version:
        description: 'Version bump type'
        required: true
        type: choice
        options:
          - none          # Skip versioning
          - graduate      # Beta → Stable
          - patch         # Bug fixes
          - minor         # New features
          - major         # Breaking changes
          - prerelease    # Increment beta
          - prepatch      # New beta patch
          - preminor      # New beta minor
          - premajor      # New beta major
      preid:
        description: 'Pre-release identifier'
        required: false
        default: 'beta'
        type: choice
        options:
          - beta
          - alpha
          - rc
          - none

permissions:
  contents: write
  id-token: write
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.ref || github.ref }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Use Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22.x
          registry-url: 'https://registry.npmjs.org/'

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Install & Build
        run: |
          yarn install --frozen-lockfile
          yarn build

      - name: Run Tests (Official Release)
        if: github.event_name == 'workflow_dispatch'
        run: |
          if [ "${{ github.event.inputs.package }}" = "all" ]; then
            yarn lerna run test --sort --concurrency=1
          else
            yarn lerna run test --scope "${{ github.event.inputs.package }}" --include-dependencies --sort --concurrency=1
          fi

      - name: Publish Canary (Pull Request)
        if: github.event_name == 'pull_request'
        env:
          npm_config_provenance: true
          npm_config_access: public
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "🧪 Performing Canary Release for Branch..."
          
          # 1. Get branch name
          RAW_BRANCH="${{ github.head_ref || github.ref_name }}"
          SAFE_BRANCH=$(echo "$RAW_BRANCH" | sed 's/\//-/g' | sed 's/refs-heads-//g')

          # 2. Use the GitHub Run Number to force an increment
          VERSION_ID="$SAFE_BRANCH.${{ github.run_number }}"

          echo "🚀 Versioning with ID: $VERSION_ID"

          yarn lerna version prerelease \
            --preid "$VERSION_ID" \
            --yes \
            --no-push \
            --no-git-tag-version \
            --force-publish \
            --allow-branch '*'

          # 3. Clean the tree
          git add .
          git commit -m "chore: temporary canary bump for run ${{ github.run_number }}"

          # 4. Publish
          yarn lerna publish from-package \
            --dist-tag "$SAFE_BRANCH" \
            --no-verify-access \
            --concurrency 1 \
            --yes

      - name: Version Packages (Official Release)
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.version != 'none'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          SCOPE_FLAG=""
          if [ "${{ github.event.inputs.package }}" != "all" ]; then
            SCOPE_FLAG="--scope ${{ github.event.inputs.package }}"
          fi

          if [[ "${{ github.event.inputs.version }}" == "graduate" ]]; then
            yarn lerna version --conventional-graduate --yes --no-private $SCOPE_FLAG
          elif [[ "${{ github.event.inputs.version }}" == pre* ]]; then
            yarn lerna version ${{ github.event.inputs.version }} --preid ${{ github.event.inputs.preid }} --yes --no-private $SCOPE_FLAG
          else
            yarn lerna version ${{ github.event.inputs.version }} --yes --no-private $SCOPE_FLAG
          fi

      - name: Publish to NPM (Official Release)
        if: github.event_name == 'workflow_dispatch'
        env:
          npm_config_provenance: true
          npm_config_access: public
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          DIST_FLAG=""
          if [[ "${{ github.event.inputs.version }}" == pre* ]] && [[ "${{ github.event.inputs.preid }}" != "none" ]]; then
            DIST_FLAG="--dist-tag ${{ github.event.inputs.preid }}"
          fi

          yarn lerna publish from-package $DIST_FLAG --no-verify-access --concurrency 1 --yes